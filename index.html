<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D Motion Drum Pro - Custom Sound Menu</title>
    <!-- MediaPipe Holistic -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/holistic/holistic.js" crossorigin="anonymous"></script>
    
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #0d0d0d; font-family: 'Segoe UI', Tahoma, sans-serif;
            overflow: hidden; color: white; user-select: none;
        }
        #main-container {
            position: relative; width: 100vw; height: 100vh;
            display: flex; justify-content: center; align-items: center;
        }
        video { display: none; }
        canvas {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%; object-fit: cover;
            transform: scaleX(-1); /* Mirror */
            z-index: 1;
        }
        
        /* UI Panel Glassmorphism */
        #ui-panel {
            position: absolute; top: 15px; left: 15px; z-index: 10;
            background: rgba(20, 20, 20, 0.88); backdrop-filter: blur(12px);
            padding: 15px; border-radius: 15px; border: 1px solid #444;
            width: 280px; max-height: 90vh; overflow-y: auto;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            transition: opacity 0.3s ease;
        }
        h1 { margin: 0 0 5px 0; font-size: 20px; color: #00ff88; }
        p { margin: 0 0 12px 0; font-size: 11px; color: #bbb; line-height: 1.3; }
        
        .control-group { margin-bottom: 12px; }
        label { font-size: 12px; font-weight: bold; display: block; margin-bottom: 4px; color: #ddd;}
        select {
            width: 100%; padding: 6px 8px; border-radius: 6px; border: 1px solid #555;
            background: #2a2a2a; color: white; outline: none; font-size: 12px;
        }
        
        button {
            width: 100%; background: linear-gradient(45deg, #00ff88, #00cc6a);
            color: black; border: none; padding: 10px; font-size: 14px; font-weight: bold;
            border-radius: 8px; cursor: pointer; transition: 0.3s;
        }
        button:hover { transform: scale(1.02); box-shadow: 0 0 12px rgba(0,255,136,0.4); }
        
        .pad-mapping-row {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 6px; background: rgba(255,255,255,0.05); padding: 5px 8px; border-radius: 6px;
        }
        .pad-mapping-row span { font-size: 11px; font-weight: bold; width: 80px; color: #00ff88; }

        /* Status & Velocity Bar */
        #status-bar {
            position: absolute; bottom: 15px; left: 50%; transform: translateX(-50%);
            z-index: 10; display: flex; gap: 15px;
            background: rgba(0,0,0,0.7); padding: 8px 18px; border-radius: 20px;
            border: 1px solid #444;
        }
        .indicator { font-size: 13px; font-weight: bold; }
        .indicator span { color: #00ff88; }
    </style>
</head>
<body>

    <div id="main-container">
        <video id="video-element" autoplay playsinline></video>
        <canvas id="output-canvas"></canvas>

        <div id="ui-panel">
            <h1>🥁 Drum Sound Menu</h1>
            <p>Atur suara tiap pad sesukamu. Kick diaktifkan dengan buka mulut! 😮</p>
            
            <button id="start-btn">Mulai Kamera & Audio</button>
            <p id="loading-text" style="color: yellow; display: none; margin-top:8px;">Memuat AI Model...</p>

            <div class="control-group" style="margin-top: 15px;">
                <label>Mode Tracking Pukulan</label>
                <select id="stick-mode">
                    <option value="stick" selected>Virtual Stick (Di Ujung Jari)</option>
                    <option value="hand">Pergelangan Tangan Saja</option>
                </select>
            </div>

            <div class="control-group">
                <label>Preset Kit Keseluruhan</label>
                <select id="preset-selector">
                    <option value="standard">Standard Rock Kit</option>
                    <option value="electro">Electro / Hip-Hop Kit</option>
                    <option value="percussion">Percussion / Acoustic</option>
                </select>
            </div>

            <hr style="border: 0; border-top: 1px solid #444; margin: 12px 0;">

            <label style="color: #00ff88; margin-bottom: 8px;">🎛️ Custom Sound Per Part Drum:</label>
            
            <div class="pad-mapping-row">
                <span>Crash (Kiri Atas)</span>
                <select id="sound-pad1" class="sound-select">
                    <option value="crash" selected>Crash Cymbal</option>
                    <option value="ride">Ride Cymbal</option>
                    <option value="hihat">Hi-Hat Closed</option>
                    <option value="snare">Snare</option>
                    <option value="tom">Tom</option>
                    <option value="kick">Kick Bass</option>
                </select>
            </div>

            <div class="pad-mapping-row">
                <span>Hi-Hat (Kiri Bwh)</span>
                <select id="sound-pad2" class="sound-select">
                    <option value="crash">Crash Cymbal</option>
                    <option value="ride">Ride Cymbal</option>
                    <option value="hihat" selected>Hi-Hat Closed</option>
                    <option value="snare">Snare</option>
                    <option value="tom">Tom</option>
                    <option value="kick">Kick Bass</option>
                </select>
            </div>

            <div class="pad-mapping-row">
                <span>Snare (Tengah)</span>
                <select id="sound-pad3" class="sound-select">
                    <option value="crash">Crash Cymbal</option>
                    <option value="ride">Ride Cymbal</option>
                    <option value="hihat">Hi-Hat Closed</option>
                    <option value="snare" selected>Snare</option>
                    <option value="tom">Tom</option>
                    <option value="kick">Kick Bass</option>
                </select>
            </div>

            <div class="pad-mapping-row">
                <span>Ride (Kanan)</span>
                <select id="sound-pad4" class="sound-select">
                    <option value="crash">Crash Cymbal</option>
                    <option value="ride" selected>Ride Cymbal</option>
                    <option value="hihat">Hi-Hat Closed</option>
                    <option value="snare">Snare</option>
                    <option value="tom">Tom</option>
                    <option value="kick">Kick Bass</option>
                </select>
            </div>

            <div class="pad-mapping-row">
                <span>Tom (Kanan Atas)</span>
                <select id="sound-pad5" class="sound-select">
                    <option value="crash">Crash Cymbal</option>
                    <option value="ride">Ride Cymbal</option>
                    <option value="hihat">Hi-Hat Closed</option>
                    <option value="snare">Snare</option>
                    <option value="tom" selected>Tom</option>
                    <option value="kick">Kick Bass</option>
                </select>
            </div>
        </div>

        <div id="status-bar" style="display: none;">
            <div class="indicator">Velocity: <span id="velo-disp">0</span>%</div>
            <div class="indicator">Kick (Mulut): <span id="kick-disp">OFF</span></div>
        </div>
    </div>

    <script>
        // --- 1. SETUP AUDIO & BANK SUARA ALTERNATIF ---
        let audioCtx;
        const audioBuffers = {};
        
        // Link audio cadangan berkualitas agar variasi preset bisa dibedakan
        const soundURLs = {
            crash: "https://raw.githubusercontent.com/wesbos/JavaScript30/master/01%20-%20JavaScript%20Drum%20Kit/sounds/crash.wav",
            ride: "https://raw.githubusercontent.com/wesbos/JavaScript30/master/01%20-%20JavaScript%20Drum%20Kit/sounds/ride.wav",
            hihat: "https://raw.githubusercontent.com/wesbos/JavaScript30/master/01%20-%20JavaScript%20Drum%20Kit/sounds/hihat.wav",
            snare: "https://raw.githubusercontent.com/wesbos/JavaScript30/master/01%20-%20JavaScript%20Drum%20Kit/sounds/snare.wav",
            tom: "https://raw.githubusercontent.com/wesbos/JavaScript30/master/01%20-%20JavaScript%20Drum%20Kit/sounds/tom.wav",
            kick: "https://raw.githubusercontent.com/wesbos/JavaScript30/master/01%20-%20JavaScript%20Drum%20Kit/sounds/kick.wav",
            // Tambahan suara alternatif untuk efek preset
            clap: "https://raw.githubusercontent.com/wesbos/JavaScript30/master/01%20-%20JavaScript%20Drum%20Kit/sounds/clap.wav",
            openhat: "https://raw.githubusercontent.com/wesbos/JavaScript30/master/01%20-%20JavaScript%20Drum%20Kit/sounds/openhat.wav"
        };

        async function loadAudio() {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            for (const [name, url] of Object.entries(soundURLs)) {
                try {
                    const res = await fetch(url);
                    audioBuffers[name] = await audioCtx.decodeAudioData(await res.arrayBuffer());
                } catch (e) { console.error(`Gagal load ${name}`); }
            }
        }

        function playSound(name, velocity = 1.0) {
            let activeSound = name;
            if (!audioCtx || !audioBuffers[activeSound]) activeSound = 'snare'; // Fallback aman
            
            const source = audioCtx.createBufferSource();
            const gainNode = audioCtx.createGain();
            
            source.buffer = audioBuffers[activeSound];
            gainNode.gain.value = Math.max(0.2, Math.min(velocity, 1.5)); 
            
            source.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            source.start(0);
            
            document.getElementById('velo-disp').innerText = Math.round(gainNode.gain.value * 100);
        }

        // --- 2. FITUR PRESET KITS ---
        const presets = {
            standard: { pad1: 'crash', pad2: 'hihat', pad3: 'snare', pad4: 'ride', pad5: 'tom' },
            electro: { pad1: 'clap', pad2: 'openhat', pad3: 'snare', pad4: 'crash', pad5: 'kick' },
            percussion: { pad1: 'ride', pad2: 'tom', pad3: 'clap', pad4: 'crash', pad5: 'hihat' }
        };

        document.getElementById('preset-selector').addEventListener('change', (e) => {
            const selectedPreset = presets[e.target.value];
            if (selectedPreset) {
                for (let [padId, soundName] of Object.entries(selectedPreset)) {
                    const selectEl = document.getElementById(`sound-${padId}`);
                    if (selectEl) selectEl.value = soundName;
                }
            }
        });

        // --- 3. DEFINISI 3D DRUM PADS ---
        const pads = [
            { id: "pad1", cx: 0.2, cy: 0.3, rx: 0.12, ry: 0.05, color: "#ffcc00", isHit: false },
            { id: "pad2", cx: 0.15, cy: 0.6, rx: 0.1, ry: 0.04, color: "#e6e600", isHit: false },
            { id: "pad3", cx: 0.45, cy: 0.7, rx: 0.12, ry: 0.06, color: "#cccccc", isHit: false },
            { id: "pad4", cx: 0.8, cy: 0.4, rx: 0.14, ry: 0.06, color: "#ff9900", isHit: false },
            { id: "pad5", cx: 0.55, cy: 0.35, rx: 0.1, ry: 0.04, color: "#3399ff", isHit: false }
        ];

        let kickCooldown = false;

        // --- 4. AI TRACKING & LOGIKA ---
        const videoElement = document.getElementById('video-element');
        const canvasElement = document.getElementById('output-canvas');
        const canvasCtx = canvasElement.getContext('2d');
        
        let prevLeftHand = {x: 0, y: 0, time: Date.now()};
        let prevRightHand = {x: 0, y: 0, time: Date.now()};

        function calculateVelocity(current, previous) {
            const dx = current.x - previous.x;
            const dy = current.y - previous.y;
            const dist = Math.sqrt(dx*dx + dy*dy);
            const timeDiff = Date.now() - previous.time;
            if(timeDiff === 0) return 0.5;
            return Math.min(Math.max(((dist / timeDiff) * 1000) * 0.1, 0.3), 1.5);
        }

        function onResults(results) {
            canvasElement.width = window.innerWidth;
            canvasElement.height = window.innerHeight;
            const w = canvasElement.width;
            const h = canvasElement.height;

            canvasCtx.save();
            canvasCtx.clearRect(0, 0, w, h);
            canvasCtx.drawImage(results.image, 0, 0, w, h);

            // Deteksi Kick via Mulut Terbuka
            if (results.faceLandmarks) {
                const upperLip = results.faceLandmarks[13];
                const lowerLip = results.faceLandmarks[14];
                const mouthOpen = Math.abs(upperLip.y - lowerLip.y);
                const kickDisp = document.getElementById('kick-disp');
                
                if (mouthOpen > 0.06 && !kickCooldown) {
                    playSound('kick', 1.2);
                    kickCooldown = true;
                    kickDisp.innerText = "ON 🔥";
                    kickDisp.style.color = "red";
                    setTimeout(() => { 
                        kickCooldown = false; 
                        kickDisp.innerText = "OFF";
                        kickDisp.style.color = "#00ff88";
                    }, 250);
                }
            }

            // Deteksi Tangan / Virtual Stick
            const mode = document.getElementById('stick-mode').value;
            let hitPoints = [];

            if (results.poseLandmarks) {
                const leftWrist = results.poseLandmarks[15];
                const rightWrist = results.poseLandmarks[16];
                const leftIndex = results.poseLandmarks[19];
                const rightIndex = results.poseLandmarks[20];

                const createHitPoint = (wrist, index, prevData) => {
                    if (!wrist || wrist.visibility < 0.5) return null;
                    let targetX, targetY;

                    if (mode === 'stick' && index) {
                        const dx = index.x - wrist.x;
                        const dy = index.y - wrist.y;
                        targetX = index.x + (dx * 1.5);
                        targetY = index.y + (dy * 1.5);
                        
                        canvasCtx.beginPath();
                        canvasCtx.moveTo(wrist.x * w, wrist.y * h);
                        canvasCtx.lineTo(targetX * w, targetY * h);
                        canvasCtx.strokeStyle = "rgba(255, 255, 255, 0.85)";
                        canvasCtx.lineWidth = 7;
                        canvasCtx.lineCap = "round";
                        canvasCtx.stroke();
                    } else {
                        targetX = wrist.x;
                        targetY = wrist.y;
                    }

                    const currentPos = {x: targetX, y: targetY};
                    const velo = calculateVelocity(currentPos, prevData);
                    prevData.x = targetX; prevData.y = targetY; prevData.time = Date.now();

                    canvasCtx.beginPath();
                    canvasCtx.arc(targetX * w, targetY * h, 10, 0, 2*Math.PI);
                    canvasCtx.fillStyle = "red";
                    canvasCtx.fill();

                    return { x: targetX, y: targetY, velocity: velo };
                };

                const hp1 = createHitPoint(leftWrist, leftIndex, prevLeftHand);
                const hp2 = createHitPoint(rightWrist, rightIndex, prevRightHand);
                if(hp1) hitPoints.push(hp1);
                if(hp2) hitPoints.push(hp2);
            }

            // Render 3D Pads & Mapping Dinamis dari Menu Dropdown
            pads.forEach(pad => {
                const px = pad.cx * w;
                const py = pad.cy * h;
                const prx = pad.rx * w;
                const pry = pad.ry * h;

                let isHitNow = false;
                let hitVelo = 0;

                hitPoints.forEach(hp => {
                    const dx = (hp.x * w) - px;
                    const dy = (hp.y * h) - py;
                    const inside = ((dx*dx) / (prx*prx)) + ((dy*dy) / (pry*pry));
                    if (inside <= 1.2) {
                        isHitNow = true;
                        hitVelo = hp.velocity;
                    }
                });

                // Ambil suara langsung dari nilai pilihan di menu dropdown UI
                const soundSelectEl = document.getElementById(`sound-${pad.id}`);
                const currentSound = soundSelectEl ? soundSelectEl.value : 'snare';

                if (isHitNow && !pad.isHit) {
                    playSound(currentSound, hitVelo);
                    pad.isHit = true;
                } else if (!isHitNow) {
                    pad.isHit = false;
                }

                // Render Visual 3D Ellipse
                canvasCtx.beginPath();
                canvasCtx.ellipse(px, py, prx, pry, 0, 0, 2 * Math.PI);
                
                const gradient = canvasCtx.createRadialGradient(px, py - (pry/2), 0, px, py, Math.max(prx, pry));
                if (pad.isHit) {
                    gradient.addColorStop(0, "#ffffff");
                    gradient.addColorStop(1, pad.color);
                    canvasCtx.shadowBlur = 25;
                    canvasCtx.shadowColor = pad.color;
                } else {
                    gradient.addColorStop(0, pad.color);
                    gradient.addColorStop(1, "#151515");
                    canvasCtx.shadowBlur = 8;
                    canvasCtx.shadowColor = "#000";
                }

                canvasCtx.fillStyle = gradient;
                canvasCtx.fill();
                canvasCtx.lineWidth = 3;
                canvasCtx.strokeStyle = "#666";
                canvasCtx.stroke();
                canvasCtx.shadowBlur = 0;
                
                // Teks Nama Sound Aktif di Atas Pad
                canvasCtx.fillStyle = "white";
                canvasCtx.font = "bold 14px Arial";
                canvasCtx.textAlign = "center";
                canvasCtx.fillText(currentSound.toUpperCase(), px, py + 4);
            });

            canvasCtx.restore();
        }

        const holistic = new Holistic({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/holistic/${file}`});
        holistic.setOptions({
            modelComplexity: 0,
            smoothLandmarks: true,
            minDetectionConfidence: 0.5,
            minTrackingConfidence: 0.5
        });
        holistic.onResults(onResults);

        // Tombol Start
        document.getElementById('start-btn').addEventListener('click', async () => {
            document.getElementById('start-btn').style.display = 'none';
            document.getElementById('loading-text').style.display = 'block';
            
            await loadAudio();

            const camera = new Camera(videoElement, {
                onFrame: async () => { await holistic.send({image: videoElement}); },
                width: 640, height: 480
            });
            camera.start();

            document.getElementById('loading-text').innerText = "Siap Dimainkan! 🥁";
            document.getElementById('status-bar').style.display = 'flex';
            
            // Efek auto-transparan panel saat tidak disentuh
            const panel = document.getElementById('ui-panel');
            setTimeout(() => { panel.style.opacity = '0.35'; }, 4000);
            panel.addEventListener('mouseenter', () => { panel.style.opacity = '1'; });
            panel.addEventListener('mouseleave', () => { panel.style.opacity = '0.35'; });
        });

        window.addEventListener('resize', () => {
            canvasElement.width = window.innerWidth;
            canvasElement.height = window.innerHeight;
        });
    </script>
</body>
</html>
