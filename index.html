<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Motion Drum Kit</title>
<style>
  * { box-sizing: border-box; margin:0; padding:0; }
  html, body {
    width:100%; height:100%; overflow:hidden;
    background:#05060a; font-family: 'Segoe UI', Arial, sans-serif;
    color:#fff;
  }
  #stage { position:relative; width:100vw; height:100vh; }
  video { display:none; }
  canvas#view {
    position:absolute; top:0; left:0; width:100%; height:100%;
    background:#000;
  }

  #panel {
    position:absolute; top:14px; left:14px; width:290px;
    max-height: 92vh; overflow-y:auto;
    background:rgba(20,22,35,0.55);
    backdrop-filter: blur(14px) saturate(160%);
    -webkit-backdrop-filter: blur(14px) saturate(160%);
    border:1px solid rgba(255,255,255,0.15);
    border-radius:16px;
    padding:14px;
    box-shadow:0 8px 32px rgba(0,0,0,0.4);
    transition: opacity .4s ease, transform .4s ease;
    z-index:10;
    font-size:12px;
  }
  #panel.playing { opacity:0.28; }
  #panel.playing:hover { opacity:0.95; }

  #panel h1 {
    font-size:15px; font-weight:600; margin-bottom:8px;
    background:linear-gradient(90deg,#7ee0ff,#c58fff);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .row { display:flex; align-items:center; justify-content:space-between; margin:6px 0; gap:6px; }
  label { opacity:0.85; }
  select, button {
    background:rgba(255,255,255,0.08);
    color:#fff; border:1px solid rgba(255,255,255,0.2);
    border-radius:8px; padding:4px 6px; font-size:11px;
    outline:none; cursor:pointer;
  }
  select:hover, button:hover { background:rgba(255,255,255,0.18); }
  #startBtn {
    width:100%; padding:9px; font-size:13px; font-weight:600;
    background:linear-gradient(90deg,#3fa9ff,#8a5cff); border:none;
    border-radius:10px; margin:8px 0; color:#fff;
  }
  .mode-toggle { display:flex; gap:4px; }
  .mode-toggle button { flex:1; }
  .mode-toggle button.active { background:linear-gradient(90deg,#3fa9ff,#8a5cff); }
  hr { border:none; border-top:1px solid rgba(255,255,255,0.15); margin:8px 0; }
  .padrow { display:flex; align-items:center; justify-content:space-between; margin:3px 0; }
  .padrow span { width:90px; opacity:0.85; font-size:11px; }
  .padrow select { flex:1; }

  #bottomBar {
    position:absolute; bottom:14px; left:50%; transform:translateX(-50%);
    display:flex; gap:18px; align-items:center;
    background:rgba(20,22,35,0.5);
    backdrop-filter: blur(10px);
    border:1px solid rgba(255,255,255,0.15);
    border-radius:14px; padding:8px 18px; z-index:10;
  }
  #velWrap { display:flex; align-items:center; gap:8px; }
  #velMeter {
    width:160px; height:10px; border-radius:6px; overflow:hidden;
    background:rgba(255,255,255,0.12);
  }
  #velFill {
    height:100%; width:0%; background:linear-gradient(90deg,#4fc3f7,#f06292);
    transition: width .05s linear;
  }
  #mouthStatus {
    padding:4px 10px; border-radius:8px; font-size:12px; font-weight:600;
    background:rgba(255,255,255,0.1);
  }
  #mouthStatus.open { background:#ff5f6d; box-shadow:0 0 14px #ff5f6d; }

  #loading {
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    flex-direction:column; gap:10px; background:#05060a; z-index:20; text-align:center;
  }
  #loading small { opacity:0.6; max-width:340px; }
  .spinner {
    width:36px; height:36px; border-radius:50%;
    border:3px solid rgba(255,255,255,0.2); border-top-color:#7ee0ff;
    animation:spin 1s linear infinite;
  }
  @keyframes spin { to { transform:rotate(360deg); } }
  .hidden { display:none !important; }
</style>
</head>
<body>
<div id="stage">
  <video id="video" playsinline></video>
  <canvas id="view"></canvas>

  <div id="panel">
    <h1>🥁 3D Motion Drum Kit</h1>
    <button id="startBtn">▶ Mulai Kamera</button>
    <div class="row">
      <label>Mode Pukul</label>
      <div class="mode-toggle">
        <button id="modeStick" class="active">Virtual Stick</button>
        <button id="modeWrist">Pergelangan</button>
      </div>
    </div>
    <hr>
    <div id="soundMap"></div>
  </div>

  <div id="bottomBar">
    <div id="velWrap">
      <label style="font-size:11px;opacity:.8;">Velocity</label>
      <div id="velMeter"><div id="velFill"></div></div>
    </div>
    <div id="mouthStatus">MULUT: TUTUP</div>
  </div>

  <div id="loading">
    <div class="spinner"></div>
    <div>Memuat model tracking...</div>
    <small>Mohon izinkan akses kamera. Gunakan orientasi layar landscape untuk pengalaman terbaik.</small>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/holistic/holistic.js" crossorigin="anonymous"></script>
<script>
/* ============================== AUDIO ENGINE ============================== */
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
const masterGain = audioCtx.createGain();
masterGain.gain.value = 0.9;
masterGain.connect(audioCtx.destination);

function makeBuffer(duration){
  return audioCtx.createBuffer(1, Math.floor(audioCtx.sampleRate*duration), audioCtx.sampleRate);
}
function highpassify(data, amount){
  let prevIn=0, prevOut=0;
  for(let i=0;i<data.length;i++){
    const x = data[i];
    const y = x - prevIn + amount*prevOut;
    prevOut = y; prevIn = x;
    data[i] = y;
  }
}

function synthKick(variant){
  const dur = variant==='808' ? 1.1 : 0.45;
  const buf = makeBuffer(dur); const d = buf.getChannelData(0); const sr=audioCtx.sampleRate;
  const startF = variant==='electronic' ? 230 : 150;
  const endF = variant==='808' ? 32 : 48;
  const decayRate = variant==='808' ? 3.2 : 9;
  for(let i=0;i<d.length;i++){
    const t=i/sr;
    const f = endF + (startF-endF)*Math.exp(-t*20);
    const env = Math.exp(-t*decayRate);
    const click = t<0.004 ? (1-t/0.004)*0.7 : 0;
    d[i] = Math.sin(2*Math.PI*f*t)*env + click;
  }
  return buf;
}
function synthSnare(variant){
  const dur = variant==='electronic' ? 0.28 : 0.22;
  const buf = makeBuffer(dur); const d = buf.getChannelData(0); const sr=audioCtx.sampleRate;
  const tone = variant==='808' ? 240 : 190;
  for(let i=0;i<d.length;i++){
    const t=i/sr;
    const noise = (Math.random()*2-1);
    const envN = Math.exp(-t*22);
    const envT = Math.exp(-t*35);
    d[i] = noise*0.55*envN + Math.sin(2*Math.PI*tone*t)*0.5*envT;
  }
  highpassify(d, variant==='acoustic'?0.3:0.55);
  return buf;
}
function synthHat(variant, open){
  const dur = open ? (variant==='808'?0.9:0.6) : (variant==='808'?0.09:0.06);
  const buf = makeBuffer(dur); const d = buf.getChannelData(0); const sr=audioCtx.sampleRate;
  const decay = open ? 3.5 : 26;
  for(let i=0;i<d.length;i++){
    const t=i/sr;
    d[i] = (Math.random()*2-1)*Math.exp(-t*decay)*0.8;
  }
  highpassify(d, 0.86);
  return buf;
}
function synthCymbal(variant, dur, bright){
  const buf = makeBuffer(dur); const d = buf.getChannelData(0); const sr=audioCtx.sampleRate;
  const partials = [1,1.48,2.14,2.87,3.62];
  for(let i=0;i<d.length;i++){
    const t=i/sr;
    let s=0;
    for(const p of partials) s += Math.sin(2*Math.PI*(220*p)*t);
    s /= partials.length;
    const noise = (Math.random()*2-1);
    const env = Math.exp(-t*(3.2/dur));
    d[i] = (s*0.4 + noise*0.6)*env;
  }
  highpassify(d, bright);
  return buf;
}
function synthTom(variant, baseFreq){
  const dur = variant==='808' ? 0.7 : 0.4;
  const buf = makeBuffer(dur); const d = buf.getChannelData(0); const sr=audioCtx.sampleRate;
  for(let i=0;i<d.length;i++){
    const t=i/sr;
    const f = baseFreq*1.6*Math.exp(-t*12) + baseFreq*0.7;
    const env = Math.exp(-t*(variant==='808'?4:7));
    d[i] = Math.sin(2*Math.PI*f*t)*env;
  }
  return buf;
}

const VARIANTS = ['acoustic','electronic','808'];
const GENERATORS = {
  kick:      v => synthKick(v),
  snare:     v => synthSnare(v),
  hihatClosed: v => synthHat(v,false),
  hihatOpen: v => synthHat(v,true),
  tom1:      v => synthTom(v, 220),
  tom2:      v => synthTom(v, 170),
  floorTom:  v => synthTom(v, 110),
  crash:     v => synthCymbal(v, v==='808'?2.4:1.8, 0.75),
  ride:      v => synthCymbal(v, v==='808'?1.6:1.3, 0.6),
  china1:    v => synthCymbal(v, v==='808'?1.4:1.0, 0.85),
  china2:    v => synthCymbal(v, v==='808'?1.4:1.0, 0.85),
  splash:    v => synthCymbal(v, v==='808'?0.6:0.4, 0.7),
};

// Pre-generate all buffers (type x variant) for instant zero-latency playback
const BUFFERS = {};
for(const type in GENERATORS){
  BUFFERS[type] = {};
  for(const v of VARIANTS){
    BUFFERS[type][v] = GENERATORS[type](v);
  }
}

function playPad(pad, velocity){
  const buf = BUFFERS[pad.type][pad.variant];
  if(!buf) return;
  const src = audioCtx.createBufferSource();
  src.buffer = buf;
  const g = audioCtx.createGain();
  const vol = Math.min(1, Math.max(0.15, velocity));
  g.gain.value = vol;
  src.connect(g).connect(masterGain);
  src.start(0);
}

/* ============================== PAD LAYOUT ============================== */
const PADS = [
  {id:'crash1',      label:'Crash 1',       type:'crash',        fx:0.06, fy:0.18, rx:0.06, ry:0.10, color:'#ffd54f', variant:'acoustic'},
  {id:'hihatOpen',   label:'HiHat Open',    type:'hihatOpen',    fx:0.20, fy:0.32, rx:0.055,ry:0.09, color:'#4fc3f7', variant:'acoustic'},
  {id:'tom1',        label:'Tom 1',         type:'tom1',         fx:0.37, fy:0.22, rx:0.05, ry:0.08, color:'#81c784', variant:'acoustic'},
  {id:'tom2',        label:'Tom 2',         type:'tom2',         fx:0.53, fy:0.22, rx:0.05, ry:0.08, color:'#81c784', variant:'acoustic'},
  {id:'ride',        label:'Ride',          type:'ride',         fx:0.69, fy:0.18, rx:0.065,ry:0.10, color:'#ffb74d', variant:'acoustic'},
  {id:'china2',      label:'China 2',       type:'china2',       fx:0.87, fy:0.20, rx:0.055,ry:0.09, color:'#e57373', variant:'acoustic'},
  {id:'hihatClosed', label:'HiHat Closed',  type:'hihatClosed',  fx:0.17, fy:0.53, rx:0.055,ry:0.09, color:'#4fc3f7', variant:'acoustic'},
  {id:'snare',       label:'Snare',         type:'snare',        fx:0.42, fy:0.56, rx:0.06, ry:0.10, color:'#f06292', variant:'acoustic'},
  {id:'floorTom',    label:'Floor Tom',     type:'floorTom',     fx:0.62, fy:0.60, rx:0.065,ry:0.10, color:'#81c784', variant:'acoustic'},
  {id:'china1',      label:'China 1',       type:'china1',       fx:0.07, fy:0.68, rx:0.05, ry:0.08, color:'#e57373', variant:'acoustic'},
  {id:'crash2',      label:'Crash 2',       type:'crash',        fx:0.92, fy:0.55, rx:0.06, ry:0.10, color:'#ffd54f', variant:'acoustic'},
  {id:'splash',      label:'Splash',        type:'splash',       fx:0.30, fy:0.77, rx:0.045,ry:0.07, color:'#ba68c8', variant:'acoustic'},
];
const KICK_PAD = {id:'kick', label:'Kick (Mulut)', type:'kick', fx:0.5, fy:0.92, rx:0.09, ry:0.06, color:'#ff8a65', variant:'acoustic'};

/* ============================== UI: sound mapping ============================== */
const soundMapEl = document.getElementById('soundMap');
function buildSoundMap(){
  const all = [KICK_PAD, ...PADS];
  all.forEach(pad=>{
    const row = document.createElement('div');
    row.className='padrow';
    const span = document.createElement('span'); span.textContent = pad.label;
    const sel = document.createElement('select');
    VARIANTS.forEach(v=>{
      const opt = document.createElement('option');
      opt.value=v; opt.textContent = v==='acoustic'?'Acoustic':v==='electronic'?'Electronic':'808';
      sel.appendChild(opt);
    });
    sel.value = pad.variant;
    sel.addEventListener('change', ()=>{ pad.variant = sel.value; });
    row.appendChild(span); row.appendChild(sel);
    soundMapEl.appendChild(row);
  });
}
buildSoundMap();

document.getElementById('modeStick').addEventListener('click', ()=>{
  handMode='stick';
  document.getElementById('modeStick').classList.add('active');
  document.getElementById('modeWrist').classList.remove('active');
});
document.getElementById('modeWrist').addEventListener('click', ()=>{
  handMode='wrist';
  document.getElementById('modeWrist').classList.add('active');
  document.getElementById('modeStick').classList.remove('active');
});
let handMode = 'stick';

/* ============================== CANVAS / VIDEO SETUP ============================== */
const video = document.getElementById('video');
const canvas = document.getElementById('view');
const ctx = canvas.getContext('2d');

function resize(){
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

/* Track pad hit state per (padId+hand) to detect enter events, plus velocity + cooldown */
const padState = {}; // key -> {inside:bool, lastHit:0}
function stateKey(padId, hand){ return padId+'_'+hand; }

let velocityDisplay = 0;
const velFill = document.getElementById('velFill');

function toScreen(lm, w, h){
  return { x: w - lm.x*w, y: lm.y*h };
}

function ellipseHit(px, py, pad, w, h){
  const cx = pad.fx*w, cy = pad.fy*h, rx = pad.rx*w, ry = pad.ry*h;
  const dx = (px-cx)/rx, dy=(py-cy)/ry;
  return (dx*dx + dy*dy) <= 1;
}

/* previous tracked points for velocity + trajectory (per hand) */
const prevPoints = { left:null, right:null };
let lastFrameTime = performance.now();

/* mouth tracking */
let mouthCooldown = 0;
const mouthStatusEl = document.getElementById('mouthStatus');

/* active pad glow timers for visual feedback */
const activeGlow = {}; // padId -> intensity 0..1

function drawPad(pad, w, h){
  const cx = pad.fx*w, cy = pad.fy*h, rx = pad.rx*w, ry = pad.ry*h;
  const glow = activeGlow[pad.id] || 0;
  ctx.save();
  ctx.translate(cx, cy);
  ctx.scale(1,1);
  const grad = ctx.createRadialGradient(0,-ry*0.3,rx*0.1, 0,0, rx);
  grad.addColorStop(0, shadeColor(pad.color, 40+glow*40));
  grad.addColorStop(0.7, pad.color);
  grad.addColorStop(1, shadeColor(pad.color, -40));
  ctx.beginPath();
  ctx.ellipse(0,0,rx,ry,0,0,Math.PI*2);
  ctx.fillStyle = grad;
  ctx.globalAlpha = 0.55 + glow*0.4;
  if(glow>0){
    ctx.shadowColor = pad.color;
    ctx.shadowBlur = 25*glow;
  }
  ctx.fill();
  ctx.globalAlpha = 1;
  ctx.lineWidth = 2 + glow*3;
  ctx.strokeStyle = 'rgba(255,255,255,'+(0.5+glow*0.5)+')';
  ctx.stroke();
  ctx.shadowBlur = 0;
  ctx.fillStyle = 'rgba(255,255,255,0.9)';
  ctx.font = '600 '+Math.max(11,rx*0.22)+'px Segoe UI';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(pad.label, 0, 0);
  ctx.restore();
}
function shadeColor(hex, percent){
  const num = parseInt(hex.slice(1),16);
  let r=(num>>16)+percent, g=((num>>8)&0xff)+percent, b=(num&0xff)+percent;
  r=Math.min(255,Math.max(0,r)); g=Math.min(255,Math.max(0,g)); b=Math.min(255,Math.max(0,b));
  return `rgb(${r},${g},${b})`;
}

function decayGlows(){
  for(const k in activeGlow){
    activeGlow[k] *= 0.88;
    if(activeGlow[k] < 0.02) delete activeGlow[k];
  }
}

/* ============================== HOLISTIC SETUP ============================== */
const holistic = new Holistic({
  locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/holistic/${file}`
});
holistic.setOptions({
  modelComplexity: 1,
  smoothLandmarks: true,
  refineFaceLandmarks: true,
  minDetectionConfidence: 0.6,
  minTrackingConfidence: 0.6,
});
holistic.onResults(onResults);

function processHand(landmarks, handKey, w, h, now){
  if(!landmarks || landmarks.length < 21) { prevPoints[handKey]=null; return; }
  const wrist = landmarks[0];
  const indexTip = landmarks[8];

  let trackedLm;
  if(handMode==='stick'){
    // extend point beyond index fingertip along wrist->index direction
    const dx = indexTip.x - wrist.x, dy = indexTip.y - wrist.y;
    const ext = 0.9; // extension factor beyond fingertip
    trackedLm = { x: indexTip.x + dx*ext, y: indexTip.y + dy*ext };
  } else {
    trackedLm = wrist;
  }

  const pt = toScreen(trackedLm, w, h);
  const wristPt = toScreen(wrist, w, h);
  const tipPt = toScreen(indexTip, w, h);

  // draw stick
  if(handMode==='stick'){
    ctx.save();
    ctx.strokeStyle = 'rgba(255,255,255,0.85)';
    ctx.lineWidth = 4;
    ctx.lineCap='round';
    ctx.beginPath();
    ctx.moveTo(wristPt.x, wristPt.y);
    ctx.lineTo(pt.x, pt.y);
    ctx.stroke();
    ctx.fillStyle='#fff';
    ctx.beginPath(); ctx.arc(pt.x, pt.y, 7, 0, Math.PI*2); ctx.fill();
    ctx.restore();
  } else {
    ctx.save();
    ctx.fillStyle='#fff';
    ctx.beginPath(); ctx.arc(pt.x, pt.y, 9, 0, Math.PI*2); ctx.fill();
    ctx.restore();
  }

  // velocity
  const prev = prevPoints[handKey];
  let speed = 0;
  if(prev){
    const dt = Math.max(1/120,(now - prev.t)/1000);
    const dist = Math.hypot(pt.x-prev.x, pt.y-prev.y);
    speed = dist/dt; // px/s
  }
  prevPoints[handKey] = {x:pt.x, y:pt.y, t:now};

  const normSpeed = Math.min(1, speed/2200); // normalize
  velocityDisplay = Math.max(velocityDisplay*0.85, normSpeed);

  // hit test against pads
  for(const pad of PADS){
    const key = stateKey(pad.id, handKey);
    const inside = ellipseHit(pt.x, pt.y, pad, w, h);
    const st = padState[key] || {inside:false, lastHit:0};
    if(inside && !st.inside && normSpeed > 0.12 && (now - st.lastHit) > 90){
      playPad(pad, 0.25 + normSpeed*0.9);
      activeGlow[pad.id] = 1;
      st.lastHit = now;
    }
    st.inside = inside;
    padState[key] = st;
  }
}

function onResults(results){
  const w = canvas.width, h = canvas.height;
  const now = performance.now();

  ctx.save();
  ctx.clearRect(0,0,w,h);
  ctx.translate(w,0);
  ctx.scale(-1,1);
  if(results.image){
    ctx.drawImage(results.image, 0, 0, w, h);
  }
  ctx.restore();

  ctx.save();

  // mouth open detection (kick)
  let mouthOpen = false;
  if(results.faceLandmarks && results.faceLandmarks.length > 14){
    const upperLip = results.faceLandmarks[13];
    const lowerLip = results.faceLandmarks[14];
    const faceTop = results.faceLandmarks[10];
    const faceBottom = results.faceLandmarks[152];
    const faceHeight = Math.hypot(faceTop.x-faceBottom.x, faceTop.y-faceBottom.y) || 0.3;
    const gap = Math.hypot(upperLip.x-lowerLip.x, upperLip.y-lowerLip.y) / faceHeight;
    mouthOpen = gap > 0.09;
  }
  mouthStatusEl.textContent = mouthOpen ? 'MULUT: BUKA (KICK!)' : 'MULUT: TUTUP';
  mouthStatusEl.classList.toggle('open', mouthOpen);
  if(mouthOpen && (now - mouthCooldown) > 260){
    playPad(KICK_PAD, 0.95);
    activeGlow[KICK_PAD.id] = 1;
    mouthCooldown = now;
  }

  // draw pads (kick + hittable)
  drawPad(KICK_PAD, w, h);
  for(const pad of PADS) drawPad(pad, w, h);

  // hands
  processHand(results.leftHandLandmarks, 'left', w, h, now);
  processHand(results.rightHandLandmarks, 'right', w, h, now);

  decayGlows();
  ctx.restore();

  velFill.style.width = Math.round(velocityDisplay*100)+'%';
  lastFrameTime = now;
}

/* ============================== START ============================== */
const startBtn = document.getElementById('startBtn');
const loadingEl = document.getElementById('loading');
const panelEl = document.getElementById('panel');
let cameraStarted = false;

startBtn.addEventListener('click', async ()=>{
  if(cameraStarted) return;
  cameraStarted = true;
  startBtn.textContent = 'Memulai...';
  if(audioCtx.state === 'suspended') await audioCtx.resume();

  const camera = new Camera(video, {
    onFrame: async () => { await holistic.send({image: video}); },
    width: 1280, height: 720
  });
  try{
    await camera.start();
    loadingEl.classList.add('hidden');
    panelEl.classList.add('playing');
    startBtn.textContent = '● Kamera Aktif';
  }catch(e){
    loadingEl.classList.add('hidden');
    alert('Gagal mengakses kamera: '+e.message);
    cameraStarted = false;
    startBtn.textContent = '▶ Mulai Kamera';
  }
});
loadingEl.classList.add('hidden'); // hide initial full loading, show start button flow instead
</script>
</body>
</html>
