<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gesture Virtual Drum Set</title>

<link rel="stylesheet" href="style.css">

<!-- MediaPipe -->
https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.jsscript>
https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.jsscript>
https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.jsscript>

</head>
<body>

<div id="app">

    <!-- Webcam -->
    <video id="video" autoplay playsinline muted></video>

    <canvas id="handCanvas"></canvas>

    <!-- Drum Stage -->
    <div id="drumStage">

        <div class="drum crash draggable" data-piece="crash">CRASH</div>
        <div class="drum ride draggable" data-piece="ride">RIDE</div>

        <div class="drum highTom draggable" data-piece="highTom">HIGH TOM</div>
        <div class="drum midTom draggable" data-piece="midTom">MID TOM</div>
        <div class="drum floorTom draggable" data-piece="floorTom">FLOOR TOM</div>

        <div class="drum hihat draggable" data-piece="closedHat">HI-HAT</div>

        <div class="drum snare draggable" data-piece="snare">SNARE</div>

        <div class="drum kick draggable" data-piece="kick">KICK</div>

    </div>

    <!-- Control Panel -->

    <div id="controlPanel">

        <h2>Settings</h2>

        <button id="startCam">Start Camera</button>

        <button id="recordBtn">Record</button>
        <button id="stopRecord">Stop</button>

        <hr>

        <label>Master Volume</label>
        <input type="range"
               id="masterVolume"
               min="0"
               max="1"
               step="0.01"
               value="0.8">

        <label>
            Reverb
            <input type="checkbox" id="reverbToggle">
        </label>

        <hr>

        <h3>Metronome</h3>

        <input type="number"
               id="bpm"
               value="120">

        <button id="metroStart">
            Start
        </button>

        <button id="metroStop">
            Stop
        </button>

        <hr>

        <div id="instrumentSettings"></div>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
